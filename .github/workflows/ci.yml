name: Tests and smoke demo
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/test_demo.mjs
      - run: causal-hedging demo --steps 64 --seeds 42 --test-paths 1
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-demo-not-benchmark
          path: |
            docs/
            results/
